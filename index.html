<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Navigation Bar</title>
  <link rel="stylesheet" href="./style/style.css">
</head>
<body>

  <header class="header">
    <nav class="navbar">
      <!-- LOGO -->
      <a href="#" class="logo">N L U M É A</a>

      <!-- HAMBURGER MENU ICON (FOR MOBILE) -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <!-- NAVIGATION LINKS -->
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#product">Korean skin care</a></li>
        <li><a href="#services">Facial care</a></li>
        <li><a href="#services">skin care</a></li>
        <li><a href="#makeup">Make-up</a></li>
        <li class="mobile-btn"><a href="/contact.html" class="btn-order">Order Now</a></li>
      </ul>

      <!-- DESKTOP ORDER NOW BUTTON -->
      <div class="nav-btn">
        <a href="/contact.html" class="btn-order">Order Now</a>
      </div>
    </nav>
  </header>

  <section id="home"></section>
  <section id="product"></section>
  <section id="services"></section>
    <section id="services"></section>
  <section id="makeup"></section>

  <section id="footer"></section>
  <script>
    // JS to load external HTML components
    function loadHTML(id, file) {
      fetch(file)
        .then(res => res.text())
        .then(data => document.getElementById(id).innerHTML = data);
    }

    loadHTML("home", "home.html");
    loadHTML("product", "product.html");
    loadHTML("services", "services.htm;");
    loadHTML("services", "services.html");
    loadHTML("contact", "contact.html");
   loadHTML("footer", "footer.html");
  </script>

</body>
</html>
